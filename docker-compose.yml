services:
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: pvivscan
    ports:
      - "54402:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pvivscan"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8202:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/pvivscan
      JWT_SECRET: pvivscan-dev-secret
      SESSION_SECRET: pvivscan-session-secret
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/pvivscan
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3202:80"
    depends_on:
      - backend

volumes:
  pgdata:
